<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — Автобазар</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Manrope, system-ui, sans-serif; background: #f4f5f8; color: #14161c; padding: 20px; box-sizing: border-box; }
    .box { text-align: center; max-width: 440px; }
    .num { font-size: 96px; font-weight: 800; letter-spacing: -4px; color: #e11d2e; line-height: 1; }
    h1 { font-size: 24px; margin: 12px 0 8px; }
    p { color: #4a5060; margin: 0 0 22px; }
    a { display: inline-block; background: #e11d2e; color: #fff; text-decoration: none; font-weight: 700; padding: 13px 24px; border-radius: 12px; }
  </style>
  <script>
    // новое объявление: страница превью ещё не собрана — открываем его в приложении
    const m = location.pathname.match(/\/share\/(car|part|master|lot)-(\d+)\.html$/);
    if (m) location.replace(location.pathname.replace(/share\/.*$/, '') + '#' + m[1] + '-' + m[2]);
  </script>
</head>
<body>
  <div class="box">
    <div class="num">404</div>
    <h1>Такой страницы нет</h1>
    <p>Возможно, объявление уже снято или ссылка неправильная. Кыргызча: мындай бет жок.</p>
    <a href="/avtobazar/">На главную Автобазара</a>
  </div>
</body>
</html>
